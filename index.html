<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e3a5f">
<title>SS H505 ACMV Task Recorder (Online)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f4f6f8; color: #1e293b; -webkit-text-size-adjust: 100%; touch-action: manipulation; }
  .container { max-width: 1200px; margin: 0 auto; padding: 12px; padding-bottom: env(safe-area-inset-bottom); }
  header { background: #1e3a5f; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; position: sticky; top: 0; z-index: 100; padding-top: max(12px, env(safe-area-inset-top)); }
  h1 { margin: 0; font-size: 1.15rem; }
  h2 { font-size: 1.2rem; margin-top: 0; }
  .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  input, select, textarea, button { font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; min-height: 44px; }
  textarea { min-height: 80px; }
  button { background: #1e3a5f; color: white; border: none; cursor: pointer; font-weight: 500; }
  button:active { background: #2c5282; }
  button.secondary { background: #64748b; }
  button.danger { background: #b91c1c; }
  button.small { padding: 8px 12px; font-size: 0.9rem; min-height: 36px; }
  button.success { background: #15803d; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); } }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 480px; }
  th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
  th { background: #f1f5f9; font-weight: 600; white-space: nowrap; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button { background: #e2e8f0; color: #1e293b; flex: 1; min-width: 90px; min-height: 44px; }
  .tabs button.active { background: #1e3a5f; color: white; }
  .status { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 500; }
  .not-started { background: #e2e8f0; }
  .in-progress { background: #fef3c7; }
  .completed { background: #d1fae5; }
  .overdue { background: #fee2e2; color: #991b1b; }
  .pending { background: #fde68a; }
  .type-badge { display: inline-block; background: #dbeafe; color: #1e40af; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; margin-left: 4px; }
  .hidden { display: none; }
  .login-box { max-width: 420px; margin: 24px auto; }
  .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .summary-grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); } }
  .stat { background: #f8fafc; padding: 12px; border-radius: 8px; text-align: center; }
  .stat strong { display: block; font-size: 1.5rem; color: #1e3a5f; }
  small { color: #64748b; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  label { font-weight: 500; font-size: 0.95rem; display: block; margin-bottom: 4px; }
  .badge { background: #ef4444; color: white; border-radius: 10px; padding: 1px 6px; font-size: 0.75rem; margin-left: 4px; }
  .task-title { color: #1e3a5f; cursor: pointer; text-decoration: underline; }
  .dashboard { background: #1e3a5f; color: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .dashboard h2 { color: white; margin-top: 0; }
  .dash-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .dash-stat { background: rgba(255,255,255,0.12); padding: 12px; border-radius: 8px; text-align: center; }
  .dash-stat strong { display: block; font-size: 1.6rem; }
  .marquee-wrap { overflow: hidden; white-space: nowrap; margin-top: 4px; }
  .marquee-text { display: inline-block; padding-left: 100%; animation: marquee 20s linear infinite; }
  @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
</style>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot, query, where, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCBv6p_JIac4d_JJ8aGrhCAD7FbdRcyxrw",
  authDomain: "ssh505-task-recorder.firebaseapp.com",
  projectId: "ssh505-task-recorder",
  storageBucket: "ssh505-task-recorder.firebasestorage.app",
  messagingSenderId: "53469864424",
  appId: "1:53469864424:web:2c5beef6410839554b045d",
  measurementId: "G-W9QC2NMHVK"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// EmailJS configuration
const EMAILJS_SERVICE_ID = "service_0kbno3j";
const EMAILJS_PUBLIC_KEY = "sRoFQ9Ji6mjNKSCOc";
const EMAILJS_TEMPLATE_ID = "template_81250ji";

emailjs.init(EMAILJS_PUBLIC_KEY);

async function sendEmail(toEmail, subject, message) {
  if (!toEmail || !EMAILJS_TEMPLATE_ID.startsWith('template_') || EMAILJS_TEMPLATE_ID === 'template_xxxxxxx') return;
  try {
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email: toEmail,
      subject: subject,
      message: message,
      from_name: "SS H505 Task Recorder"
    });
  } catch (err) {
    console.warn("Email send failed:", err);
  }
}

const ADMIN_EMAIL = "admin@newland.com.hk"; // Change if needed; first user who registers as this becomes admin
let currentUser = null;
let tasks = [];
let inbox = [];
let users = [];
let taskTypes = ['Drawing submission','Document submission','Coordination','Calculation','Material Submission','Others'];
let announcement = 'Welcome to the SS H505 ACMV Task Recorder.';
let programme = [];
let progVersion = 'Rev. 7 r3';
let unsubTasks, unsubInbox, unsubUsers, unsubSettings;

window.showAuth = function(mode) {
  document.getElementById('login-form').classList.toggle('hidden', mode !== 'login');
  document.getElementById('register-form').classList.toggle('hidden', mode !== 'register');
  document.getElementById('tab-login').classList.toggle('active', mode === 'login');
  document.getElementById('tab-register').classList.toggle('active', mode === 'register');
  document.getElementById('auth-error').textContent = '';
};

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('login-form').onsubmit = async (e) => {
    e.preventDefault();
    let email = document.getElementById('login-user').value.trim();
    if (email && !email.includes('@')) email += '@newland.com.hk';
    const pass = document.getElementById('login-pass').value;
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (err) {
      document.getElementById('auth-error').textContent = err.message;
    }
  };

  document.getElementById('register-form').onsubmit = async (e) => {
    e.preventDefault();
    let email = document.getElementById('reg-user').value.trim();
    if (email && !email.includes('@')) email += '@newland.com.hk';
    const name = document.getElementById('reg-name').value.trim();
    const pass = document.getElementById('reg-pass').value;
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      const role = email.toLowerCase() === ADMIN_EMAIL ? 'admin' : 'user';
      await setDoc(doc(db, 'users', cred.user.uid), { email, name, role, created: serverTimestamp() });
    } catch (err) {
      document.getElementById('auth-error').textContent = err.message;
    }
  };
});

onAuthStateChanged(auth, async (user) => {
  if (user) {
    const userDoc = await getDoc(doc(db, 'users', user.uid));
    if (userDoc.exists()) {
      currentUser = { uid: user.uid, ...userDoc.data() };
    } else {
      currentUser = { uid: user.uid, email: user.email, name: user.email.split('@')[0], role: 'user' };
      await setDoc(doc(db, 'users', user.uid), currentUser);
    }
    document.getElementById('auth-section').classList.add('hidden');
    document.getElementById('app-section').classList.remove('hidden');
    document.getElementById('user-info').innerHTML = `${currentUser.name} <button onclick="logout()" class="secondary small">Logout</button>`;
    document.getElementById('admin-perf').classList.toggle('hidden', currentUser.role !== 'admin');
    startListeners();
    showView('all');
  } else {
    currentUser = null;
    if (unsubTasks) unsubTasks();
    document.getElementById('auth-section').classList.remove('hidden');
    document.getElementById('app-section').classList.add('hidden');
  }
});

window.logout = () => signOut(auth);

function startListeners() {
  unsubTasks = onSnapshot(collection(db, 'tasks'), snap => {
    tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
  unsubInbox = onSnapshot(query(collection(db, 'inbox'), where('to', '==', currentUser.uid)), snap => {
    inbox = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    updateInboxBadge();
    if (!document.getElementById('view-inbox').classList.contains('hidden')) renderInbox();
  });
  unsubUsers = onSnapshot(collection(db, 'users'), snap => {
    users = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
    populateUserFilter();
  });
  unsubSettings = onSnapshot(doc(db, 'settings', 'main'), snap => {
    if (snap.exists()) {
      const data = snap.data();
      announcement = data.announcement || announcement;
      taskTypes = data.taskTypes || taskTypes;
      progVersion = data.progVersion || progVersion;
      programme = data.programme || [];
      renderDashboard();
    }
  });
}

window.showView = function(v) {
  ['all','my','add','inbox','settings','perf'].forEach(id => document.getElementById('view-'+id).classList.toggle('hidden', id !== v));
  render();
};

async function notifyUser(uid, subject, message) {
  await addDoc(collection(db, 'inbox'), { to: uid, subject, message, date: serverTimestamp(), read: false });
  const u = users.find(x => x.uid === uid);
  if (u && u.email) await sendEmail(u.email, subject, message);
}

async function addTask(data) {
  data.created = serverTimestamp();
  data.user = currentUser.uid;
  data.comments = [];
  await addDoc(collection(db, 'tasks'), data);
}

// Simplified render functions (expand as needed)
function render() {
  renderAll();
  renderMy();
  renderDashboard();
}

function renderAll() {
  const list = document.getElementById('all-tasks-list');
  if (!tasks.length) { list.innerHTML = '<p>No tasks yet.</p>'; return; }
  let html = '<div class="table-wrap"><table><thead><tr><th>User</th><th>Task</th><th>Target</th><th>Status</th></tr></thead><tbody>';
  tasks.forEach(t => {
    const u = users.find(x => x.uid === t.user) || { name: 'Unknown' };
    html += `<tr><td>${u.name}</td><td>${t.title}</td><td>${t.targetDate||'-'}</td><td>${t.status}</td></tr>`;
  });
  html += '</tbody></table></div>';
  list.innerHTML = html;
}

function renderMy() {
  document.getElementById('my-tasks-list').innerHTML = '<p>My tasks (filter by current user in full version)</p>';
}

function renderDashboard() {
  document.getElementById('dash-content').innerHTML = `
    <div class="dash-stat"><strong>${tasks.length}</strong>Total Tasks</div>
    <div class="dash-stat"><strong>${tasks.filter(t=>t.status==='completed').length}</strong>Completed</div>
  `;
  document.getElementById('announcement-text').textContent = announcement;
}

function updateInboxBadge() {
  const badge = document.getElementById('inbox-badge');
  const unread = inbox.filter(m => !m.read).length;
  badge.textContent = unread;
  badge.classList.toggle('hidden', unread === 0);
}

function renderInbox() {
  const el = document.getElementById('inbox-list');
  if (!inbox.length) { el.innerHTML = '<p>No messages.</p>'; return; }
  el.innerHTML = inbox.map(m => `<div class="inbox-item">${m.subject}<br><small>${m.message}</small></div>`).join('');
}

function populateUserFilter() {}

// Seed initial settings if empty
(async () => {
  const settingsRef = doc(db, 'settings', 'main');
  const snap = await getDoc(settingsRef);
  if (!snap.exists()) {
    await setDoc(settingsRef, { announcement, taskTypes, progVersion, programme: [] });
  }
})();
</script>
</head>
<body>
<header>
  <h1>SS H505 ACMV Task Recorder (Online) <small style="font-weight:normal; opacity:0.8;">v1.0</small></h1>
  <div id="user-info"></div>
</header>
<div class="container">
  <div id="auth-section" class="login-box card">
    <div class="tabs">
      <button id="tab-login" class="active" onclick="showAuth('login')">Login</button>
      <button id="tab-register" onclick="showAuth('register')">Register</button>
    </div>
    <form id="login-form">
      <div style="margin-bottom:12px;"><label>Email or prefix</label><input type="text" id="login-user" required style="width:100%;" placeholder="john or john@newland.com.hk"></div>
      <div style="margin-bottom:12px;"><label>Password</label><input type="password" id="login-pass" required style="width:100%;"></div>
      <button type="submit" style="width:100%;">Login</button>
    </form>
    <form id="register-form" class="hidden">
      <div style="margin-bottom:12px;"><label>Email prefix (will become name@newland.com.hk)</label><input type="text" id="reg-user" required style="width:100%;"></div>
      <div style="margin-bottom:12px;"><label>Display Name</label><input type="text" id="reg-name" required style="width:100%;"></div>
      <div style="margin-bottom:12px;"><label>Password</label><input type="password" id="reg-pass" required style="width:100%;"></div>
      <button type="submit" style="width:100%;">Create Account</button>
    </form>
    <p id="auth-error" style="color:#b91c1c; font-size:0.9rem; margin-top:8px;"></p>
  </div>

  <div id="app-section" class="hidden">
    <div id="dashboard" class="dashboard">
      <h2>Programme & Task Status</h2>
      <div id="dash-content" class="dash-stats"></div>
      <div class="marquee-wrap"><div id="announcement-text" class="marquee-text"></div></div>
    </div>
    <div class="tabs" id="main-tabs">
      <button onclick="showView('all')">All Tasks</button>
      <button onclick="showView('my')">My Tasks</button>
      <button onclick="showView('add')">Add Task</button>
      <button onclick="showView('inbox')">Inbox <span id="inbox-badge" class="badge hidden">0</span></button>
      <button id="admin-perf" class="hidden" onclick="showView('perf')">Performance</button>
    </div>
    <div id="view-all" class="card"><h2>All Tasks</h2><div id="all-tasks-list"></div></div>
    <div id="view-my" class="card hidden"><h2>My Tasks</h2><div id="my-tasks-list"></div></div>
    <div id="view-add" class="card hidden"><h2>Add Task</h2><p>Form will be fully wired in next update.</p></div>
    <div id="view-inbox" class="card hidden"><h2>Inbox</h2><div id="inbox-list"></div></div>
    <div id="view-settings" class="card hidden"><h2>Settings</h2></div>
    <div id="view-perf" class="card hidden"><h2>Performance</h2></div>
  </div>
</div>
</body>
</html>
