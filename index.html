<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SS H505 ACMV Task Recorder (Online)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f4f6f8; color: #1e293b; -webkit-text-size-adjust: 100%; touch-action: manipulation; }
  .container { max-width: 1200px; margin: 0 auto; padding: 12px; padding-bottom: env(safe-area-inset-bottom); }
  header { background: #1e3a5f; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; position: sticky; top: 0; z-index: 100; padding-top: max(12px, env(safe-area-inset-top)); }
  h1 { margin: 0; font-size: 1.15rem; }

  button { background: #1e3a5f; color: white; border: none; cursor: pointer; font-weight: 500; }
  button:active { background: #2c5282; }
  button.secondary { background: #64748b; }
  button.danger { background: #b91c1c; }

  button:disabled { opacity: 0.6; }

  @media (min-width: 640px) { .grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); } }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
  th { background: #f1f5f9; font-weight: 600; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button { background: #e2e8f0; color: #1e293b; flex: 1; min-width: 90px; min-height: 44px; }
  .tabs button.active { background: #1e3a5f; color: white; }

  .dashboard { background: #1e3a5f; color: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .dashboard h2 { color: white; margin-top: 0; }
  .dash-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .dash-stat { background: rgba(255,255,255,0.12); padding: 12px; border-radius: 8px; text-align: center; }
  .dash-stat strong { display: block; font-size: 1.6rem; }
  .marquee-wrap { overflow: hidden; white-space: nowrap; margin-top: 4px; }
  .marquee-text { display: inline-block; padding-left: 100%; animation: marquee 20s linear infinite; }
  @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
  .detail-row td { background: #f8fafc; padding: 14px 12px; }
  .prog-activity { background: rgba(255,255,255,0.1); padding: 8px 10px; border-radius: 6px; margin-top: 6px; font-size: 0.9rem; }

  .score { font-weight: 700; color: #1e3a5f; }
</style>
<script>
function showAuth(mode) {
  document.getElementById('login-form').classList.toggle('hidden', mode !== 'login');
  document.getElementById('register-form').classList.toggle('hidden', mode !== 'register');
  document.getElementById('tab-login').classList.toggle('active', mode === 'login');
  document.getElementById('tab-register').classList.toggle('active', mode === 'register');
  document.getElementById('auth-error').textContent = '';
}
// Placeholders so buttons never say "not defined"
window.acceptTask = window.acceptTask || function() { alert('Please wait for the page to finish loading.'); };
window.rejectTask = window.rejectTask || function() { alert('Please wait for the page to finish loading.'); };
window.deleteInboxMessage = window.deleteInboxMessage || function() { alert('Please wait for the page to finish loading.'); };
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, onSnapshot, query, where, addDoc, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCBv6p_JIac4d_JJ8aGrhCAD7FbdRcyxrw",
  authDomain: "ssh505-task-recorder.firebaseapp.com",
  projectId: "ssh505-task-recorder",
  storageBucket: "ssh505-task-recorder.firebasestorage.app",
  messagingSenderId: "53469864424",
  appId: "1:53469864424:web:2c5beef6410839554b045d",
  measurementId: "G-W9QC2NMHVK"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_EMAIL = "admin@newland.com.hk";
let currentUser = null;
let tasks = [];
let inbox = [];
let users = [];
let announcement = 'Welcome to the SS H505 ACMV Task Recorder.';
let programme = [];
let progVersion = 'Rev. 7 r3 (21 Jul 2026)';
let expandedTaskId = null;
let unsubTasks, unsubInbox, unsubUsers, unsubSettings;

function isAdmin() { 
  if (!currentUser) return false;
  const email = (currentUser.email || '').toLowerCase();
  const name = (currentUser.name || '').toLowerCase();
  return currentUser.role === 'admin' || email.includes('admin') || name.includes('admin');
}
function today() { return new Date().toISOString().slice(0,10); }
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr); const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}
function isOverdue(t) { return t.status !== 'completed' && t.targetDate && daysUntil(t.targetDate) < 0; }
function escape(s) { return String(s||'').replace(/[&<>"']/g, m => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[m])); }
function scoreLabel(s) {
  if (s == null) return '';
  if (s <= 2) return 'Improvement Required';
  if (s <= 4) return 'Satisfied';
  return 'Well Done';
}

function updateAdminUI() {
  const admin = isAdmin();
  ['admin-perf','admin-announcement','admin-prog-upload','assign-box','admin-tools'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('hidden', !admin);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('login-form').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    btn.textContent = 'Logging in...';
    btn.disabled = true;
    const errEl = document.getElementById('auth-error');
    errEl.textContent = '';
    let email = document.getElementById('login-user').value.trim();
    if (email && !email.includes('@')) email += '@newland.com.hk';
    const pass = document.getElementById('login-pass').value;
    try {
      console.log('Trying login with:', email);
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (err) {
      console.error('Login error:', err.code, err.message);
      let msg = err.message;
      if (err.code === 'auth/user-not-found') msg = 'Account not found. Please Register first.';
      if (err.code === 'auth/wrong-password') msg = 'Wrong password.';
      if (err.code === 'auth/invalid-credential') msg = 'Invalid credentials. Register first if this account does not exist.';
      if (err.code === 'auth/invalid-email') msg = 'Invalid email format.';
      if (err.code === 'auth/unauthorized-domain') msg = 'Domain not authorized. Add kwtsang37.github.io in Firebase Console.';
      errEl.textContent = msg + ' [code: ' + (err.code || 'unknown') + ']';
      btn.textContent = 'Login';
      btn.disabled = false;
    }
  };

  document.getElementById('register-form').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    btn.textContent = 'Creating...';
    btn.disabled = true;
    document.getElementById('auth-error').textContent = '';
    let email = document.getElementById('reg-user').value.trim();
    if (email && !email.includes('@')) email += '@newland.com.hk';
    const name = document.getElementById('reg-name').value.trim();
    const pass = document.getElementById('reg-pass').value;
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      const role = email.toLowerCase() === ADMIN_EMAIL ? 'admin' : 'user';
      await setDoc(doc(db, 'users', cred.user.uid), { email, name, role, created: serverTimestamp() });
    } catch (err) {
      document.getElementById('auth-error').textContent = err.message;
      btn.textContent = 'Create Account';
      btn.disabled = false;
    }
  };

  document.getElementById('task-form').onsubmit = async (e) => {
    e.preventDefault();
    if (!currentUser) return;
    const editId = document.getElementById('edit-id').value;
    const data = {
      title: document.getElementById('task-title').value.trim(),
      type: document.getElementById('task-type').value,
      description: document.getElementById('task-desc').value.trim(),
      targetDate: document.getElementById('task-target').value,
      status: document.getElementById('task-status').value
    };
    if (editId) {
      await updateDoc(doc(db, 'tasks', editId), data);
      document.getElementById('edit-id').value = '';
    } else {
      const assign = document.getElementById('task-assign') ? document.getElementById('task-assign').value : 'self';
      data.user = assign === 'self' ? currentUser.uid : (assign === 'TBC' ? null : assign);
      data.acceptance = assign === 'TBC' ? 'open' : (assign === 'self' ? null : 'pending');
      data.created = serverTimestamp();
      data.comments = [];
      data.score = null;
      const ref = await addDoc(collection(db, 'tasks'), data);
      if (data.acceptance === 'pending' && data.user) {
        await addDoc(collection(db, 'inbox'), { to: data.user, subject: 'Task assigned to you', message: data.title, taskId: ref.id, date: serverTimestamp(), read: false });
      }
    }
    document.getElementById('task-form').reset();
    showView('all');
  };
});

onAuthStateChanged(auth, async (user) => {
  if (user) {
    document.getElementById('auth-section').classList.add('hidden');
    document.getElementById('app-section').classList.remove('hidden');
    // Always show something in header first
    document.getElementById('user-info').innerHTML = `${user.email.split('@')[0]} <button onclick="logout()" class="secondary small">Logout</button>`;
    try {
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      currentUser = userDoc.exists() ? { uid: user.uid, ...userDoc.data() } : { uid: user.uid, email: user.email, name: user.email.split('@')[0], role: 'user' };
      // Fallback if name/email missing from Firestore
      if (!currentUser.email) currentUser.email = user.email;
      if (!currentUser.name) currentUser.name = user.email ? user.email.split('@')[0] : 'Admin';
      if ((currentUser.email || '').toLowerCase().includes('admin') || (currentUser.name || '').toLowerCase().includes('admin')) {
        currentUser.role = 'admin';
        await setDoc(doc(db, 'users', user.uid), { role: 'admin', email: currentUser.email, name: currentUser.name }, { merge: true });
      }
      document.getElementById('user-info').innerHTML = `${currentUser.name || 'Admin'} <button onclick="logout()" class="secondary small">Logout</button>`;
      updateAdminUI();
    } catch (err) {
      console.error('Profile load error:', err);
      currentUser = { uid: user.uid, email: user.email, name: user.email.split('@')[0], role: 'user' };
      document.getElementById('user-info').innerHTML = `${currentUser.name} <button onclick="logout()" class="secondary small">Logout</button>`;
    }
    startListeners();
    showView('all');
  } else {
    currentUser = null;
    if (unsubTasks) unsubTasks();
    document.getElementById('auth-section').classList.remove('hidden');
    document.getElementById('app-section').classList.add('hidden');
  }
});

window.logout = async function() {
  try { await signOut(auth); } catch (e) { console.warn(e); }
  currentUser = null;
  document.getElementById('auth-section').classList.remove('hidden');
  document.getElementById('app-section').classList.add('hidden');
  document.getElementById('user-info').innerHTML = '';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
  document.getElementById('auth-error').textContent = '';
  const btn = document.querySelector('#login-form button[type="submit"]');
  if (btn) { btn.textContent = 'Login'; btn.disabled = false; }
  showAuth('login');
};

function startListeners() {
  if (unsubTasks) unsubTasks();
  unsubTasks = onSnapshot(collection(db, 'tasks'), snap => { tasks = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); });
  unsubInbox = onSnapshot(query(collection(db, 'inbox'), where('to', '==', currentUser.uid)), snap => { inbox = snap.docs.map(d => ({ id: d.id, ...d.data() })); updateInboxBadge(); });
  unsubUsers = onSnapshot(collection(db, 'users'), snap => { users = snap.docs.map(d => ({ uid: d.id, ...d.data() })); populateUserFilter(); populateAssign(); });
  unsubSettings = onSnapshot(doc(db, 'settings', 'main'), snap => {
    if (snap.exists()) {
      announcement = snap.data().announcement || announcement;
      programme = snap.data().programme || programme;
      progVersion = snap.data().progVersion || progVersion;
      if (snap.data().taskTypes) {
        window._taskTypes = snap.data().taskTypes;
        renderTypeDropdowns();
      }
    }
    renderDashboard();
  });
}

window.showView = function(v) {
  ['all','my','add','inbox','settings','perf'].forEach(id => document.getElementById('view-'+id).classList.toggle('hidden', id !== v));
  render();
};

window.markCompleted = async function(id) {
  if (!confirm('Mark as Completed?')) return;
  const t = tasks.find(x => x.id === id);
  await updateDoc(doc(db, 'tasks', id), { status: 'completed', actualDate: today() });
  // Notify admin
  const adminUser = users.find(u => u.role === 'admin' || (u.email || '').toLowerCase().includes('admin'));
  if (adminUser && adminUser.uid !== currentUser.uid) {
    await addDoc(collection(db, 'inbox'), {
      to: adminUser.uid,
      subject: 'Task completed',
      message: `${currentUser.name || 'A user'} marked "${t ? t.title : 'a task'}" as completed. Please score it.`,
      taskId: id,
      date: serverTimestamp(),
      read: false
    });
  }
};

window.editTask = function(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  document.getElementById('task-title').value = t.title || '';
  document.getElementById('task-type').value = t.type || '';
  document.getElementById('task-target').value = t.targetDate || '';
  document.getElementById('task-status').value = t.status || 'not-started';
  document.getElementById('task-desc').value = t.description || '';
  document.getElementById('edit-id').value = id;
  showView('add');
};

window.deleteTask = async function(id) {
  if (!confirm('Delete this task?')) return;
  try {
    await deleteDoc(doc(db, 'tasks', id));
    expandedTaskId = null;
  } catch (err) { alert('Delete failed: ' + err.message); }
};

window.acceptTask = async function(id) {
  if (!currentUser) { alert('Not logged in'); return; }
  try {
    await updateDoc(doc(db, 'tasks', id), { status: 'in-progress', acceptance: null, user: currentUser.uid });
    alert('Task accepted.');
  } catch (err) { alert('Accept failed: ' + err.message); }
};

window.rejectTask = async function(id) {
  if (!currentUser) { alert('Not logged in'); return; }
  const reason = prompt('Reason for rejection:');
  if (!reason) return;
  try {
    await updateDoc(doc(db, 'tasks', id), { acceptance: 'rejected', user: null, status: 'not-started' });
    alert('Task rejected.');
  } catch (err) { alert('Reject failed: ' + err.message); }
};

window.deleteInboxMessage = async function(id) {
  if (!confirm('Delete this message?')) return;
  try {
    await deleteDoc(doc(db, 'inbox', id));
  } catch (err) { alert('Delete failed: ' + err.message); }
};

window.addComment = async function(id) {
  const comment = prompt('Add comment:');
  if (!comment) return;
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  const comments = t.comments || [];
  comments.push((currentUser.name || 'User') + ': ' + comment);
  await updateDoc(doc(db, 'tasks', id), { comments });
};

window.setScore = async function(id) {
  if (!isAdmin()) return;
  const score = prompt('Score (1-5):');
  if (!score || isNaN(score) || score < 1 || score > 5) return;
  await updateDoc(doc(db, 'tasks', id), { score: Number(score) });
};

window.addTaskType = async function() {
  if (!isAdmin()) return;
  const name = prompt('New task type name:');
  if (!name) return;
  const types = [...new Set([...(window._taskTypes || ['Drawing submission','Document submission','Coordination','Calculation','Material Submission','Others']), name])];
  window._taskTypes = types;
  await setDoc(doc(db, 'settings', 'main'), { taskTypes: types }, { merge: true });
  renderTypeDropdowns();
  alert('Type added.');
};

function renderTypeDropdowns() {
  const types = window._taskTypes || ['Drawing submission','Document submission','Coordination','Calculation','Material Submission','Others'];
  const opts = types.map(t => `<option>${escape(t)}</option>`).join('');
  const addSel = document.getElementById('task-type');
  const filterSel = document.getElementById('filter-type');
  if (addSel) addSel.innerHTML = opts;
  if (filterSel) filterSel.innerHTML = '<option value="">All</option>' + opts;
}

window.checkOverdue = async function() {
  const overdue = tasks.filter(isOverdue);
  for (const t of overdue) {
    if (t.user) {
      await addDoc(collection(db, 'inbox'), {
        to: t.user, subject: 'Task overdue', message: `"${t.title}" is overdue.`, date: serverTimestamp(), read: false
      });
    }
  }
  if (overdue.length) alert(overdue.length + ' overdue notification(s) sent.');
};

window.changePassword = async function() {
  const newPass = prompt('Enter new password (min 6 characters):');
  if (!newPass || newPass.length < 6) { alert('Password too short'); return; }
  try {
    const { updatePassword } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
    await updatePassword(auth.currentUser, newPass);
    alert('Password updated.');
  } catch (err) {
    alert('Failed: ' + err.message + '\nYou may need to re-login first.');
  }
window.deleteInboxMessage = async function(id) {
  if (!confirm('Delete this message?')) return;
  await deleteDoc(doc(db, 'inbox', id));
};

window.renderIndividual = function() {
  const uid = document.getElementById('indiv-user') ? document.getElementById('indiv-user').value : '';
  if (!uid) return;
  const u = users.find(x => x.uid === uid);
  const list = tasks.filter(t => t.user === uid);
  const completed = list.filter(t => t.status === 'completed');
  const scored = completed.filter(t => t.score != null);
  const avg = scored.length ? (scored.reduce((a,t) => a + t.score, 0) / scored.length).toFixed(1) : '-';
  document.getElementById('indiv-result').innerHTML = `<h4>${escape(u ? u.name : uid)}</h4><p>Tasks: ${list.length} · Completed: ${completed.length} · Avg: ${avg}</p>`;
};
  if (!isAdmin()) return;
  const c = prompt('Comment:');
  if (!c) return;
  const t = tasks.find(x => x.id === id);
  const comments = t.comments || [];
  comments.push(currentUser.name + ': ' + c);
  await updateDoc(doc(db, 'tasks', id), { comments });
};

window.saveAnnouncement = async function() {
  if (!isAdmin()) return;
  const text = document.getElementById('announcement-edit').value.trim();
  await setDoc(doc(db, 'settings', 'main'), { announcement: text }, { merge: true });
  alert('Saved.');
};

window.downloadProgrammeTemplate = function() {
  const csv = 'activity,start,finish\nAccess / Start on site,2025-05-12,2025-05-12\nContract completion,2029-02-09,2029-02-09\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = 'programme_template.csv';
  a.click();
};

window.uploadProgramme = async function() {
  if (!isAdmin()) return;
  const file = document.getElementById('prog-file').files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(e) {
    const lines = e.target.result.split(/\r?\n/).filter(l => l.trim());
    const acts = [];
    lines.slice(1).forEach(line => {
      const p = line.split(',').map(x => x.trim());
      if (p.length >= 3) acts.push({ activity: p[0], start: p[1], finish: p[2] });
    });
    if (acts.length) {
      await setDoc(doc(db, 'settings', 'main'), { programme: acts, progVersion: file.name }, { merge: true });
      alert('Programme updated.');
    }
  };
  reader.readAsText(file);
};

function render() { renderAll(); renderMy(); renderDashboard(); renderInbox(); if (isAdmin()) renderPerf(); updateInboxBadge(); }

function renderInbox() {
  const el = document.getElementById('inbox-list');
  if (!el) return;
  if (!inbox.length) { el.innerHTML = '<p>No messages.</p>'; return; }
  el.innerHTML = inbox.map(m => `<div style="padding:10px 0; border-bottom:1px solid #eee;">
    <strong>${escape(m.subject || 'Message')}</strong><br>
    <small>${escape(m.message || '')}</small>
    <div class="actions" style="margin-top:6px;">
      ${m.taskId ? `<button class="small success" onclick="acceptTask('${m.taskId}')">Accept</button> <button class="small danger" onclick="rejectTask('${m.taskId}')">Reject</button>` : ''}
      <button class="small secondary" onclick="deleteInboxMessage('${m.id}')">Delete</button>
    </div>
  </div>`).join('');
}

function renderAll() {
  const uf = document.getElementById('filter-user').value;
  const tf = document.getElementById('filter-type').value;
  const sf = document.getElementById('filter-status').value;
  let list = tasks.slice();
  if (uf) list = list.filter(t => t.user === uf);
  if (tf) list = list.filter(t => t.type === tf);
  if (sf === 'overdue') list = list.filter(isOverdue);
  else if (sf === 'pending') list = list.filter(t => t.acceptance === 'pending' || t.acceptance === 'open');
  else if (sf) list = list.filter(t => t.status === sf);
  const el = document.getElementById('all-tasks-list');
  if (!list.length) { el.innerHTML = '<p>No matching tasks.</p>'; return; }
  let html = `<div class="table-wrap"><table><thead><tr><th>User</th><th>Task</th><th>Target</th><th>Status</th><th></th>${isAdmin()?'<th>Score</th>':''}</tr></thead><tbody>`;
  list.forEach(t => {
    const u = users.find(x => x.uid === t.user);
    const canComplete = t.user === currentUser.uid && t.status !== 'completed';
    html += `<tr>
      <td>${t.user ? escape(u ? u.name : 'Unknown') : 'TBC'}</td>
      <td><span class="task-title" onclick="toggleTaskDetail('${t.id}')">${escape(t.title)}</span> <span class="type-badge">${escape(t.type||'')}</span></td>
      <td>${t.targetDate||'-'}</td>
      <td><span class="status ${isOverdue(t)?'overdue':(t.acceptance==='pending'?'pending':t.status)}">${isOverdue(t)?'Overdue':(t.acceptance==='pending'?'Pending':t.status)}</span></td>
      <td>${canComplete ? `<button class="small success" onclick="markCompleted('${t.id}')">Complete</button>` : ''}</td>
      ${isAdmin() ? `<td>${t.score != null ? t.score+'/5' : '-'}</td>` : ''}
    </tr>`;
    if (expandedTaskId === t.id) {
      const isOwner = t.user === currentUser.uid;
      const canEdit = isOwner || isAdmin();
      html += `<tr class="detail-row"><td colspan="${isAdmin()?6:5}">
        <strong>${escape(t.title)}</strong> <span class="type-badge">${escape(t.type||'')}</span><br>
        <small>Owner: ${escape(users.find(u=>u.uid===t.user)?.name || 'TBC')} · Target: ${t.targetDate||'-'}</small>
        <p>${escape(t.description||'(no description)')}</p>
        ${t.comments && t.comments.length ? '<div class="comment">' + t.comments.map(c => escape(c)).join('<br>') + '</div>' : ''}
        <div class="actions" style="margin-top:8px;">
          ${canEdit ? `<button class="small secondary" onclick="editTask('${t.id}')">Edit</button>` : ''}
          ${isOwner && t.status !== 'completed' ? `<button class="small success" onclick="markCompleted('${t.id}')">Mark Completed</button>` : ''}
          ${canEdit ? `<button class="small danger" onclick="deleteTask('${t.id}')">Delete</button>` : ''}
          <button class="small" onclick="addComment('${t.id}')">Comment</button>
          ${isAdmin() ? `<button class="small secondary" onclick="setScore('${t.id}')">Score</button>` : ''}
          <button class="small secondary" onclick="toggleTaskDetail('${t.id}')">Close</button>
        </div>
        ${t.acceptance === 'open' ? `<button class="small success" onclick="acceptTask('${t.id}')" style="margin-top:6px;">Accept as mine</button>` : ''}
        ${t.acceptance === 'pending' && t.user === currentUser.uid ? `<div class="actions" style="margin-top:6px;"><button class="small success" onclick="acceptTask('${t.id}')">Accept</button> <button class="small danger" onclick="rejectTask('${t.id}')">Reject</button></div>` : ''}
      </td></tr>`;
    }
  });
  html += '</tbody></table></div>';
  el.innerHTML = html;
}

function renderMy() {
  const mine = tasks.filter(t => t.user === currentUser.uid || t.acceptance === 'open');
  const el = document.getElementById('my-tasks-list');
  if (!mine.length) { el.innerHTML = '<p>No tasks.</p>'; return; }
  el.innerHTML = '<div class="table-wrap"><table><thead><tr><th>Task</th><th>Target</th><th>Status</th></tr></thead><tbody>' +
    mine.map(t => `<tr><td>${escape(t.title)}</td><td>${t.targetDate||'-'}</td><td>${t.status}</td></tr>`).join('') +
    '</tbody></table></div>';
}

function renderDashboard() {
  const completed = tasks.filter(t => t.status === 'completed').length;
  const overdue = tasks.filter(isOverdue).length;
  const start = new Date('2025-05-12'); const end = new Date('2029-02-09'); const now = new Date();
  const totalDays = Math.round((end - start) / 86400000);
  const passedDays = Math.max(0, Math.round((now - start) / 86400000));
  const prog = Math.min(100, Math.round(passedDays / totalDays * 100));
  document.getElementById('prog-version').textContent = '· ' + progVersion;
  document.getElementById('dash-content').innerHTML = `
    <div class="dash-stat"><strong>${prog}%</strong>Elapsed<br><small>${passedDays}/${totalDays} days</small></div>
    <div class="dash-stat"><strong>${completed}</strong>Completed</div>
    <div class="dash-stat"><strong>${tasks.length - completed}</strong>Open</div>
    <div class="dash-stat"><strong>${overdue}</strong>Overdue</div>
  `;
  document.getElementById('announcement-text').textContent = announcement;
  if (isAdmin()) document.getElementById('announcement-edit').value = announcement;
  const todayStr = today();
  const active = programme.filter(a => a.start <= todayStr && a.finish >= todayStr);
  document.getElementById('today-activities').innerHTML = '<strong>Today:</strong>' + (active.length ? active.map(a => `<div class="prog-activity">${escape(a.activity)}</div>`).join('') : '<div class="prog-activity">None</div>');
}

function populateUserFilter() {
  const sel = document.getElementById('filter-user');
  if (!sel) return;
  sel.innerHTML = '<option value="">All</option>';
  users.forEach(u => sel.innerHTML += `<option value="${u.uid}">${escape(u.name)}</option>`);
}

function populateAssign() {
  const sel = document.getElementById('task-assign');
  if (!sel) return;
  sel.innerHTML = '<option value="self">Myself</option><option value="TBC">TBC (open)</option>';
  users.forEach(u => { if (u.uid !== currentUser.uid) sel.innerHTML += `<option value="${u.uid}">${escape(u.name)}</option>`; });
}

function updateInboxBadge() {
  const badge = document.getElementById('inbox-badge');
  if (!badge) return;
  const unread = inbox.filter(m => !m.read).length;
  badge.textContent = unread;
  badge.classList.toggle('hidden', unread === 0);
}

window.showPerfTab = function(tab) {
  document.getElementById('perf-team').classList.toggle('hidden', tab !== 'team');
  document.getElementById('perf-indiv').classList.toggle('hidden', tab !== 'indiv');
  document.getElementById('perf-team-tab').classList.toggle('active', tab === 'team');
  document.getElementById('perf-indiv-tab').classList.toggle('active', tab === 'indiv');
  if (tab === 'indiv') populateIndivUsers();
};

function populateIndivUsers() {
  const sel = document.getElementById('indiv-user');
  if (!sel) return;
  sel.innerHTML = users.filter(u => u.role !== 'admin').map(u => `<option value="${u.uid}">${escape(u.name)}</option>`).join('');
}

function renderPerf() {
  if (!isAdmin()) return;
  const userMap = {};
  users.filter(u => u.role !== 'admin').forEach(u => {
    userMap[u.uid] = { name: u.name, total: 0, completed: 0, overdue: 0, scores: [], onTime: 0 };
  });
  tasks.forEach(t => {
    if (!t.user || !userMap[t.user]) return;
    const b = userMap[t.user];
    b.total++;
    if (t.status === 'completed') {
      b.completed++;
      if (t.actualDate && t.targetDate && t.actualDate <= t.targetDate) b.onTime++;
    }
    if (isOverdue(t)) b.overdue++;
    if (t.score != null) b.scores.push(t.score);
  });
  const arr = Object.values(userMap);
  const totalTasks = tasks.length;
  const totalCompleted = tasks.filter(t => t.status === 'completed').length;
  const scored = tasks.filter(t => t.score != null);
  const avgScore = scored.length ? (scored.reduce((a,t) => a + t.score, 0) / scored.length).toFixed(1) : '-';
  document.getElementById('perf-summary').innerHTML = `
    <div class="stat"><strong>${users.filter(u=>u.role!=='admin').length}</strong>Users</div>
    <div class="stat"><strong>${totalTasks}</strong>Tasks</div>
    <div class="stat"><strong>${totalCompleted}</strong>Completed</div>
    <div class="stat"><strong>${avgScore}</strong>Avg score</div>`;
  let html = `<div class="table-wrap"><table><thead><tr><th>Teammate</th><th>Tasks</th><th>Completed</th><th>On-time</th><th>Overdue</th><th>Avg Score</th></tr></thead><tbody>`;
  arr.sort((a,b) => b.total - a.total).forEach(b => {
    const avg = b.scores.length ? (b.scores.reduce((a,c)=>a+c,0)/b.scores.length).toFixed(1) : '-';
    const onTimePct = b.completed ? Math.round(b.onTime / b.completed * 100) + '%' : '-';
    html += `<tr><td>${escape(b.name)}</td><td>${b.total}</td><td>${b.completed}</td><td>${onTimePct}</td><td>${b.overdue}</td><td>${avg}</td></tr>`;
  });
  html += '</tbody></table></div>';
  document.getElementById('perf-table').innerHTML = html || '<p>No data.</p>';

  const typeCount = {};
  const defaultTypes = ['Drawing submission','Document submission','Coordination','Calculation','Material Submission','Others'];
  defaultTypes.forEach(t => typeCount[t] = 0);
  tasks.forEach(t => { if (t.type) typeCount[t.type] = (typeCount[t.type] || 0) + 1; });
  let th = '<div class="table-wrap"><table><thead><tr><th>Type</th><th>Count</th></tr></thead><tbody>';
  Object.keys(typeCount).forEach(t => th += `<tr><td>${escape(t)}</td><td>${typeCount[t]}</td></tr>`);
  th += '</tbody></table></div>';
  document.getElementById('type-breakdown').innerHTML = th;
}

(async () => {
  const settingsRef = doc(db, 'settings', 'main');
  const snap = await getDoc(settingsRef);
  if (!snap.exists()) {
    await setDoc(settingsRef, {
      announcement,
      progVersion,
      programme: [
        { activity: 'Access / Start on site', start: '2025-05-12', finish: '2025-05-12' },
        { activity: 'Contract completion', start: '2029-02-09', finish: '2029-02-09' }
      ]
    });
  }
})();
</script>
</head>
<body>
<header>
  <h1>SS H505 ACMV Task Recorder <small style="font-weight:normal; opacity:0.8;">(Online) v8.0</small></h1>
  <div id="user-info"></div>
</header>
<div class="container">
  <div id="auth-section" class="login-box card">
    <div class="tabs">
      <button id="tab-login" class="active" onclick="showAuth('login')">Login</button>
      <button id="tab-register" onclick="showAuth('register')">Register</button>
    </div>
    <form id="login-form">
      <div style="margin-bottom:12px;"><label>Email or prefix</label><input type="text" id="login-user" required style="width:100%;" placeholder="admin"></div>
      <div style="margin-bottom:12px;"><label>Password</label><input type="password" id="login-pass" required style="width:100%;"></div>
      <button type="submit" style="width:100%;">Login</button>
    </form>
    <form id="register-form" class="hidden">
      <div style="margin-bottom:12px;"><label>Email prefix (becomes name@newland.com.hk)</label><input type="text" id="reg-user" required style="width:100%;"></div>
      <div style="margin-bottom:12px;"><label>Display Name</label><input type="text" id="reg-name" required style="width:100%;"></div>
      <div style="margin-bottom:12px;"><label>Password</label><input type="password" id="reg-pass" required style="width:100%;"></div>
      <button type="submit" style="width:100%;">Create Account</button>
    </form>
    <p id="auth-error" style="color:#b91c1c; font-size:0.9rem; margin-top:8px;"></p>
    <p style="font-size:0.8rem; color:#64748b;">Register <strong>admin</strong> first to create the admin account.</p>
  </div>

  <div id="app-section" class="hidden">
    <div id="dashboard" class="dashboard">
      <h2>Programme & Task Status <small id="prog-version" style="font-weight:normal; opacity:0.85;"></small></h2>
      <div id="dash-content" class="dash-stats"></div>
      <div id="announcement-box" style="margin-top:12px; background:rgba(255,255,255,0.15); padding:10px 12px; border-radius:8px;">
        <strong>Announcement</strong>
        <div class="marquee-wrap"><div id="announcement-text" class="marquee-text"></div></div>
        <div id="admin-announcement" class="hidden" style="margin-top:8px;">
          <textarea id="announcement-edit" rows="3" style="width:100%; background:white; color:#1e293b;"></textarea>
          <button type="button" class="small" onclick="saveAnnouncement()" style="margin-top:6px;">Save Announcement</button>
        </div>
      </div>
      <div id="today-activities" style="margin-top:12px;"></div>
      <div id="admin-prog-upload" class="hidden" style="margin-top:12px;">
        <label style="color:white;">Update Master Programme (admin)</label>
        <div style="margin-top:6px;"><button type="button" class="small secondary" onclick="downloadProgrammeTemplate()">Download CSV Template</button></div>
        <input type="file" id="prog-file" accept=".csv,.json,.txt" style="margin-top:8px; background:white; color:#1e293b;">
        <button type="button" class="small" onclick="uploadProgramme()" style="margin-top:6px;">Upload & Replace</button>
      </div>
    </div>

    <div class="tabs">
      <button onclick="showView('all')">All Tasks</button>
      <button onclick="showView('my')">My Tasks</button>
      <button onclick="showView('add')">Add Task</button>
      <button onclick="showView('inbox')">Inbox <span id="inbox-badge" class="badge hidden">0</span></button>
      <button id="admin-perf" class="hidden" onclick="showView('perf')">Performance</button>
      <button onclick="showView('settings')">Settings</button>
    </div>

    <div id="view-all" class="card">
      <h2>All Tasks</h2>
      <div class="grid" style="margin-bottom:12px;">
        <div><label>User</label><select id="filter-user" style="width:100%;"><option value="">All</option></select></div>
        <div><label>Type</label><select id="filter-type" style="width:100%;"><option value="">All</option>
          <option>Drawing submission</option><option>Document submission</option><option>Coordination</option>
          <option>Calculation</option><option>Material Submission</option><option>Others</option>
        </select></div>
        <div><label>Status</label><select id="filter-status" style="width:100%;"><option value="">All</option>
          <option value="not-started">Not Started</option><option value="in-progress">In Progress</option>
          <option value="completed">Completed</option><option value="overdue">Overdue</option>
          <option value="pending">Pending</option>
        </select></div>
      </div>
      <div id="all-tasks-list"></div>
    </div>

    <div id="view-my" class="card hidden"><h2>My Tasks</h2><div id="my-tasks-list"></div></div>

    <div id="view-add" class="card hidden">
      <h2>Add Task</h2>
      <form id="task-form">
        <div class="grid">
          <div><label>Task Title *</label><input type="text" id="task-title" required style="width:100%;"></div>
          <div><label>Type</label>
            <select id="task-type" style="width:100%;">
              <option>Drawing submission</option><option>Document submission</option>
              <option>Coordination</option><option>Calculation</option>
              <option>Material Submission</option><option>Others</option>
            </select>
          </div>
          <div><label>Target Completion Date *</label><input type="date" id="task-target" required style="width:100%;"></div>
          <div><label>Status</label>
            <select id="task-status" style="width:100%;">
              <option value="not-started">Not Started</option>
              <option value="in-progress">In Progress</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <div id="assign-box" class="hidden">
            <label>Assign to</label>
            <select id="task-assign" style="width:100%;">
              <option value="self">Myself</option>
              <option value="TBC">TBC (open)</option>
            </select>
          </div>
        </div>
        <div style="margin-top:12px;"><label>Description</label><textarea id="task-desc" rows="3" style="width:100%;"></textarea></div>
        <div style="margin-top:12px;"><button type="submit">Save Task</button></div>
        <input type="hidden" id="edit-id">
      </form>
    </div>

    <div id="view-inbox" class="card hidden"><h2>Inbox</h2><div id="inbox-list"></div></div>
    <div id="view-settings" class="card hidden">
      <h2>Settings</h2>
      <button type="button" onclick="changePassword()">Change Password</button>
      <div id="admin-tools" class="hidden" style="margin-top:16px;">
        <h3>Admin Tools</h3>
        <button type="button" class="small" onclick="addTaskType()">Add Task Type</button>
        <button type="button" class="small secondary" onclick="checkOverdue()">Send Overdue Notifications</button>
      </div>
    </div>
    <div id="view-perf" class="card hidden">
      <h2>Performance</h2>
      <div class="tabs" style="margin-bottom:12px;">
        <button class="active" id="perf-team-tab" onclick="showPerfTab('team')">Team</button>
        <button id="perf-indiv-tab" onclick="showPerfTab('indiv')">Individual</button>
      </div>
      <div id="perf-team">
        <h3>Team Overview</h3>
        <div id="perf-summary" class="summary-grid" style="margin-bottom:16px;"></div>
        <div id="perf-table"></div>
        <h3 style="margin-top:20px;">Task Type Breakdown</h3>
        <div id="type-breakdown"></div>
      </div>
      <div id="perf-indiv" class="hidden">
        <h3>Individual Performance</h3>
        <div class="grid" style="margin-bottom:12px;">
          <div><label>User</label><select id="indiv-user" style="width:100%;"></select></div>
          <div><label>From</label><input type="date" id="indiv-from" style="width:100%;"></div>
          <div><label>To</label><input type="date" id="indiv-to" style="width:100%;"></div>
        </div>
        <button type="button" onclick="renderIndividual()">Search</button>
        <div id="indiv-result" style="margin-top:16px;"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
